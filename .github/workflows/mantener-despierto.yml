# Llama al backend de Render cada 10 minutos para que el plan gratis no se "duerma"
# (si pasa 15 minutos sin uso, la siguiente entrada tarda cerca de 1 minuto).
# El backend revisa la base cada hora, así que esto también evita que Supabase pause el proyecto.
name: Mantener el backend despierto

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # para correrlo a mano desde la pestaña Actions

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar a /api/v1/salud
        run: |
          for intento in 1 2 3; do
            if curl -fsS --max-time 90 https://gymtrack-backend-x7do.onrender.com/api/v1/salud; then
              echo; echo "Backend despierto"; exit 0
            fi
            echo "Intento $intento sin respuesta, reintento en 20 s"; sleep 20
          done
          echo "El backend no respondió"; exit 1
