# Los valores sensibles se leen de variables de entorno; el valor después de ":" es el default para desarrollo local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gymtrack_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
# El esquema lo maneja Flyway (db/migration). Hibernate solo verifica que coincida con las entidades.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
server.port=${PORT:8080}
# Detrás de un proxy (Render, o Vite en desarrollo) usa la IP real del cliente (X-Forwarded-For)
server.forward-headers-strategy=native

# Pool de conexiones chico: Supabase (plan gratis) limita las conexiones
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
# Base que ya existía sin historial de Flyway: se marca como V1 (esquema inicial) y recibe V2 en adelante
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT
# En producción definir JWT_SECRET (mínimo 32 caracteres)
jwt.secret=${JWT_SECRET:GymTrackSecretKey2026SpringBoot4JJWT012xMuyLargoParaHMACSHA256Seguridad}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Seguridad
# true en el servidor real: exige JWT_SECRET propio
app.produccion=${APP_PRODUCCION:false}
# Orígenes del frontend permitidos (separados por coma). Para probar desde el celular en la red local
# agregar la IP de la PC, ej: http://192.168.0.10:5173
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}
# Secreto del QR de ingreso (por defecto deriva del JWT_SECRET)
qr.secret=${QR_SECRET:${jwt.secret}}
# Primer administrador (solo se crea si no hay ninguno, ej. base nueva en Supabase)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}


# Email por SMTP — se configura con variables de entorno (ver CONFIGURAR-MAIL.md).
# Por defecto apunta a Gmail: alcanza con MAIL_USERNAME (la casilla), MAIL_PASSWORD
# (contraseña de aplicación de Google) y MAIL_ENABLED=true.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
mail.from=${MAIL_FROM:${MAIL_USERNAME:gymtrack@localhost}}
mail.enabled=${MAIL_ENABLED:false}