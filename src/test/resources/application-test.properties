# Perfil de pruebas: NUNCA la base real (gymtrack_db).
# Por defecto usa gymtrack_test; se puede apuntar a otra con TEST_DB_URL.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/gymtrack_test}
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:1234}
# Sin jobs programados ni mails durante las pruebas
mail.enabled=false
backup.habilitado=false
